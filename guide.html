<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузия: Туры и Путеводитель</title>
    <!-- Стили Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Ссылку на css обновили под вашу структуру папок -->
    <link rel="stylesheet" href="css/guide.css">
</head>
<body>

    <header class="guide-header">
        <!-- Переключатель языков -->
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="pl">PL</button>
        </div>
        
        <h1 id="headerTitle">Авторские туры по Грузии</h1>
        <p id="headerSubtitle">Выберите направление, дату и забронируйте незабываемую поездку в WhatsApp</p>
    </header>

    <main class="container">
        <div class="destinations-grid" id="destinationsGrid"></div>
    </main>

    <!-- Модальное окно -->
    <div id="bookingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Название направления</h2>
            
            <div class="modal-gallery" id="modalGallery"></div>

            <p id="modalDesc" class="modal-desc"></p>
            
            <div class="price-notice">
                <span id="priceText">💰 Стоимость: <strong>от 350₾ / $130</strong> за тур</span>
                <p id="priceDesc">Цена зависит от состава группы и маршрута. Обсудим детали и пожелания индивидуально!</p>
            </div>

            <div class="booking-form">
                <label for="tourDate" id="dateLabel">Выберите дату тура:</label>
                <input type="text" id="tourDate" placeholder="Нажмите, чтобы выбрать дату..." readonly>
                
                <button id="whatsappBtn" class="whatsapp-btn">
                    Забронировать в WhatsApp 📱
                </button>
            </div>
        </div>
    </div>

    <!-- Скрипты календаря, локализации и ваш JS из папки js/ -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pl.js"></script>
    <script src="js/guide.js"></script>
</body>
</html>

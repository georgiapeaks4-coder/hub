<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Грузия: Туры и Путеводитель</title>
    <!-- Стили Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Общие стили хаба для единой айдентики -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Локальные стили для сетки туров и модалки -->
    <link rel="stylesheet" href="css/guide.css">
</head>
<body>
    <div class="page-background"></div>
    <div class="page-overlay"></div>

    <!-- Шапка идентичная основному хабу -->
    <header class="site-header">
        <div class="header-left">
            <span class="logo">GEORGIA PEAKS</span>
            <span class="weather-widget">Тбилиси • 5 октября 2026 г. | ☀️ 13°C</span>
        </div>
        <div class="header-right">
            <a href="https://wa.me/+4851597913" target="_blank" class="wa-header-btn">
                <span>Написать в WhatsApp</span>
            </a>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ru">RU</button>
                <button class="lang-btn" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="pl">PL</button>
            </div>
        </div>
    </header>

    <!-- Заголовок страницы туров -->
    <main class="main-container" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
        <div style="margin-bottom: 30px;">
            <h1 style="font-size: 32px; margin: 0 0 10px 0;">Авторские туры по Грузии</h1>
            <p style="color: #94a3b8; margin: 0; font-size: 16px;">Выберите направление, дату и забронируйте незабываемую поездку в WhatsApp</p>
        </div>

        <!-- Сетка карточек -->
        <div class="destinations-grid" id="destinations-grid"></div>
    </main>

    <!-- Модальное окно -->
    <div id="tour-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="close-modal" style="position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #fff;">&times;</span>
            <div id="modal-body-content"></div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/guide.js"></script>
</body>
</html>
